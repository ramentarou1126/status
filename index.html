<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STATUS // ステータス監視</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070a;
    --panel: rgba(13, 19, 28, 0.72);
    --panel-hover: rgba(18, 26, 38, 0.85);
    --line: rgba(76, 141, 255, 0.14);
    --border: rgba(0, 229, 255, 0.28);
    --border-strong: rgba(0, 229, 255, 0.55);
    --text: #d6f3ff;
    --muted: #5c7086;
    --ok: #00e5ff;
    --ok-glow: rgba(0, 229, 255, 0.55);
    --down: #ff3864;
    --down-glow: rgba(255, 56, 100, 0.55);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px),
      radial-gradient(ellipse at 20% -10%, rgba(0, 229, 255, 0.08), transparent 55%);
    background-size: 42px 42px, 42px 42px, 100% 100%;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    left: 0; right: 0; top: -10%;
    height: 140px;
    background: linear-gradient(180deg, transparent, rgba(0, 229, 255, 0.06), transparent);
    pointer-events: none;
    animation: scan 9s ease-in-out infinite;
    z-index: 0;
  }

  @keyframes scan {
    0%   { transform: translateY(0); }
    100% { transform: translateY(1100%); }
  }

  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none; }
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 980px;
    margin: 0 auto;
    padding: 44px 20px 90px;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 3px;
    margin: 0 0 8px;
    text-transform: uppercase;
  }

  header h1 span.tick { color: var(--ok); }

  #summary-line { color: var(--muted); font-size: 13px; letter-spacing: 0.5px; }
  #summary-line b { color: var(--text); font-weight: normal; }

  .header-right { display: flex; align-items: center; gap: 14px; }

  #last-updated {
    text-align: right;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.6;
  }

  #global-dot {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    margin-right: 10px;
    vertical-align: middle;
    background: var(--ok);
    box-shadow: 0 0 10px 2px var(--ok-glow);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  #scan-btn {
    font-family: 'Share Tech Mono', monospace;
    background: transparent;
    color: var(--ok);
    border: 1px solid var(--border-strong);
    padding: 9px 16px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  #scan-btn:hover { background: rgba(0, 229, 255, 0.08); box-shadow: 0 0 12px rgba(0, 229, 255, 0.25); }
  #scan-btn:disabled { opacity: 0.4; cursor: default; box-shadow: none; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 16px;
  }

  .card {
    position: relative;
    background: var(--panel);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    padding: 20px 20px 16px;
    transition: background 0.15s ease, border-color 0.15s ease;
    animation: appear 0.5s ease both;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card:hover { background: var(--panel-hover); border-color: var(--border-strong); }

  .card::before, .card::after, .card .corner-br, .card .corner-bl {
    content: "";
    position: absolute;
    width: 12px; height: 12px;
    pointer-events: none;
  }
  .card::before { top: -1px; left: -1px; border-top: 2px solid var(--border-strong); border-left: 2px solid var(--border-strong); }
  .card::after  { top: -1px; right: -1px; border-top: 2px solid var(--border-strong); border-right: 2px solid var(--border-strong); }
  .card .corner-bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--border-strong); border-left: 2px solid var(--border-strong); }
  .card .corner-br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--border-strong); border-right: 2px solid var(--border-strong); }

  .card.down { border-color: rgba(255, 56, 100, 0.4); }
  .card.down::before, .card.down::after, .card.down .corner-bl, .card.down .corner-br { border-color: var(--down); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 14px;
  }

  .type-badge { font-size: 9px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 5px; }

  .site-name {
    font-family: 'Orbitron', sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin: 0;
    cursor: pointer;
    color: var(--text);
    background: none;
    border: none;
    padding: 0;
    text-align: left;
  }
  .site-name:hover { color: var(--ok); text-shadow: 0 0 8px var(--ok-glow); }

  .status-pill {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 4px 10px;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .status-pill.up      { color: var(--ok);   border-color: rgba(0,229,255,0.4);  text-shadow: 0 0 6px var(--ok-glow); }
  .status-pill.down    { color: var(--down);  border-color: rgba(255,56,100,0.4); text-shadow: 0 0 6px var(--down-glow); }
  .status-pill.unknown { color: var(--muted); border-color: rgba(92,112,134,0.4); }

  .site-meta { font-size: 11px; color: var(--muted); margin-bottom: 10px; }

  .heartbeat { display: flex; align-items: flex-end; gap: 2px; height: 30px; margin: 14px 0; }
  .bar { flex: 1; min-width: 2px; background: rgba(92,112,134,0.25); }
  .bar.up   { background: var(--ok);   box-shadow: 0 0 4px var(--ok-glow);   opacity: 0.85; }
  .bar.down { background: var(--down); box-shadow: 0 0 4px var(--down-glow); }

  .stats-row {
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: var(--muted);
    padding-top: 12px;
    border-top: 1px solid var(--line);
    letter-spacing: 0.5px;
  }
  .stats-row .stat b { display: block; color: var(--text); font-size: 14px; font-weight: normal; margin-top: 3px; }

  .empty-state, .error-state {
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
    border: 1px dashed var(--border);
    font-size: 13px;
    line-height: 1.8;
  }
  .empty-state h2, .error-state h2 { font-family: 'Orbitron', sans-serif; color: var(--text); font-size: 15px; letter-spacing: 1px; }

  footer { margin-top: 44px; text-align: center; color: var(--muted); font-size: 10px; letter-spacing: 0.5px; }

  /* モーダル */
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(2, 4, 7, 0.82);
    backdrop-filter: blur(3px);
    z-index: 10;
    padding: 40px 16px;
    overflow-y: auto;
  }
  #overlay.open { display: block; }

  .modal {
    position: relative;
    max-width: 640px;
    margin: 0 auto;
    background: #0a0e15;
    border: 1px solid var(--border-strong);
    box-shadow: 0 0 40px rgba(0, 229, 255, 0.08);
    padding: 28px 26px 26px;
  }
  .modal::before, .modal::after { content: ""; position: absolute; width: 16px; height: 16px; }
  .modal::before { top: -1px; left: -1px; border-top: 2px solid var(--ok); border-left: 2px solid var(--ok); }
  .modal::after  { bottom: -1px; right: -1px; border-bottom: 2px solid var(--ok); border-right: 2px solid var(--ok); }

  .modal-close {
    position: absolute; top: 18px; right: 22px;
    background: none; border: none;
    color: var(--muted); font-size: 20px; cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
  }
  .modal-close:hover { color: var(--text); }

  .modal h2 { font-family: 'Orbitron', sans-serif; font-size: 18px; letter-spacing: 1px; margin: 0 0 4px; padding-right: 30px; }
  .modal .modal-meta { color: var(--muted); font-size: 12px; margin-bottom: 20px; }

  .modal-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
  .modal-stats .stat { border: 1px solid var(--line); padding: 10px 8px; text-align: center; }
  .modal-stats .stat .label { font-size: 9px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .modal-stats .stat .value { font-size: 16px; margin-top: 6px; }

  .graph-title { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .graph-wrap  { border: 1px solid var(--line); padding: 12px 10px 8px; margin-bottom: 24px; }
  .graph-bars  { display: flex; align-items: flex-end; gap: 1px; height: 70px; }
  .graph-bars .bar { flex: 1; min-width: 1px; }
  .graph-labels { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); margin-top: 6px; }

  .incidents h3 { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin: 0 0 10px; }
  .incident-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .incident-row.ongoing { color: var(--down); }
  .incident-row span:first-child { color: var(--text); }
  .incident-row.ongoing span:first-child { color: var(--down); }
  .none-text { color: var(--muted); font-size: 12px; }

  .visit-btn {
    display: inline-block;
    color: var(--ok);
    border: 1px solid var(--border-strong);
    padding: 8px 16px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .visit-btn:hover { background: rgba(0, 229, 255, 0.08); box-shadow: 0 0 12px rgba(0, 229, 255, 0.25); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="tick">//</span> STATUS</h1>
      <div id="summary-line">読み込み中...</div>
    </div>
    <div class="header-right">
      <div id="last-updated"></div>
      <button id="scan-btn">SCAN NOW</button>
    </div>
  </header>

  <div id="content">
    <div class="empty-state"><h2>読み込み中</h2></div>
  </div>

  <footer></footer>
</div>

<div id="overlay">
  <div class="modal" id="modal-body"></div>
</div>

<script>
  // ============================================================
  // ここだけ自分の環境に合わせて書き換える
  // ============================================================
  var WORKER_URL = "https://site-monitor.あなたのサブドメイン.workers.dev";
  // ============================================================

  var STATUS_URL     = "data/status.json";
  var HEARTBEAT_PTS  = 48;
  var REFRESH_MS     = 5 * 60 * 1000;

  function fmtTime(ts) {
    if (!ts) return "-";
    return new Date(ts * 1000).toLocaleString("ja-JP", {
      month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
    });
  }
  function fmtDuration(sec) {
    if (sec < 60) return sec + "秒";
    var min = Math.round(sec / 60);
    if (min < 60) return min + "分";
    var hr = Math.floor(min / 60), rem = min % 60;
    return rem ? hr + "時間" + rem + "分" : hr + "時間";
  }
  function uptimeSince(history, sinceSec) {
    var now = Math.floor(Date.now() / 1000);
    var rel = history.filter(function(h){ return h.t >= now - sinceSec; });
    if (!rel.length) return null;
    return (rel.filter(function(h){ return h.up; }).length / rel.length) * 100;
  }
  function avgMs(history, sinceSec) {
    var now = Math.floor(Date.now() / 1000);
    var rel = history.filter(function(h){ return h.t >= now - sinceSec && h.up && typeof h.ms === "number"; });
    if (!rel.length) return null;
    return Math.round(rel.reduce(function(a,h){ return a + h.ms; }, 0) / rel.length);
  }
  function findIncidents(history) {
    var inc = [], cur = null;
    history.forEach(function(p){
      if (!p.up && !cur) cur = { start: p.t, end: null };
      else if (p.up && cur) { cur.end = p.t; inc.push(cur); cur = null; }
    });
    if (cur) inc.push(cur);
    return inc.reverse();
  }
  function renderBars(pts, total) {
    var html = "";
    for (var i = 0; i < total - pts.length; i++) html += '<div class="bar"></div>';
    pts.forEach(function(p){
      html += '<div class="bar ' + (p.up ? "up" : "down") + '" title="'
        + fmtTime(p.t) + " / " + (p.up ? "稼働中" : "停止") + (p.ms ? " / " + p.ms + "ms" : "")
        + '"></div>';
    });
    return html;
  }
  function metaLabel(site, last) {
    if (site.type !== "mc" || !last || !last.meta || last.meta.players == null) return "";
    return last.meta.players + " / " + (last.meta.maxPlayers != null ? last.meta.maxPlayers : "-") + " プレイヤー";
  }

  function renderCard(site) {
    var hist = site.history || [];
    var last = hist[hist.length - 1];
    var sc   = !last ? "unknown" : (last.up ? "up" : "down");
    var sl   = !last ? "NO DATA" : (last.up ? "稼働中" : "停止中");
    var u24  = uptimeSince(hist, 86400);
    var u7d  = uptimeSince(hist, 604800);
    var am   = avgMs(hist, 86400);
    var meta = metaLabel(site, last);

    var card = document.createElement("div");
    card.className = "card" + (sc === "down" ? " down" : "");
    card.innerHTML =
      '<span class="corner-bl"></span><span class="corner-br"></span>' +
      '<div class="card-top"><div>' +
        '<div class="type-badge">' + (site.type === "mc" ? "MINECRAFT SERVER" : "WEBSITE") + '</div>' +
        '<button class="site-name">' + site.name + '</button>' +
      '</div>' +
      '<span class="status-pill ' + sc + '">' + sl + '</span></div>' +
      (meta ? '<div class="site-meta">' + meta + '</div>' : '') +
      '<div class="heartbeat">' + renderBars(hist.slice(-HEARTBEAT_PTS), HEARTBEAT_PTS) + '</div>' +
      '<div class="stats-row">' +
        '<div class="stat">24H<b>' + (u24 === null ? "-" : u24.toFixed(1) + "%") + '</b></div>' +
        '<div class="stat">7D<b>'  + (u7d === null ? "-" : u7d.toFixed(1) + "%") + '</b></div>' +
        (site.type !== "mc" ? '<div class="stat">応答<b>' + (am === null ? "-" : am + "ms") + '</b></div>' : '') +
      '</div>';
    card.querySelector(".site-name").addEventListener("click", function(){ openDetail(site); });
    return card;
  }

  function openDetail(site) {
    var hist  = site.history || [];
    var last  = hist[hist.length - 1];
    var sc    = !last ? "unknown" : (last.up ? "up" : "down");
    var sl    = !last ? "NO DATA" : (last.up ? "稼働中" : "停止中");
    var meta  = metaLabel(site, last);
    var u1h   = uptimeSince(hist, 3600);
    var u24   = uptimeSince(hist, 86400);
    var u7d   = uptimeSince(hist, 604800);
    var am    = avgMs(hist, 86400);
    var mid   = hist.length ? hist[Math.floor(hist.length / 2)] : null;
    var inc   = findIncidents(hist);
    var iHtml = !inc.length
      ? '<p class="none-text">記録されている停止はありません</p>'
      : inc.slice(0, 20).map(function(i){
          return i.end === null
            ? '<div class="incident-row ongoing"><span>' + fmtTime(i.start) + ' 〜 継続中</span><span>ONGOING</span></div>'
            : '<div class="incident-row"><span>' + fmtTime(i.start) + ' 〜 ' + fmtTime(i.end) + '</span><span>' + fmtDuration(i.end - i.start) + '</span></div>';
        }).join("");

    document.getElementById("modal-body").innerHTML =
      '<button class="modal-close">×</button>' +
      '<h2>' + site.name + '</h2>' +
      '<div class="modal-meta"><span class="status-pill ' + sc + '">' + sl + '</span>' + (meta ? " &nbsp;" + meta : "") + '</div>' +
      '<div class="modal-stats">' +
        '<div class="stat"><div class="label">1H</div><div class="value">'  + (u1h === null ? "-" : u1h.toFixed(1) + "%") + '</div></div>' +
        '<div class="stat"><div class="label">24H</div><div class="value">' + (u24 === null ? "-" : u24.toFixed(1) + "%") + '</div></div>' +
        '<div class="stat"><div class="label">7D</div><div class="value">'  + (u7d === null ? "-" : u7d.toFixed(1) + "%") + '</div></div>' +
        '<div class="stat"><div class="label">応答</div><div class="value">'+ (am  === null ? "-" : am  + "ms")            + '</div></div>' +
      '</div>' +
      '<div class="graph-title">ステータス履歴(最大1週間)</div>' +
      '<div class="graph-wrap"><div class="graph-bars">' + renderBars(hist, hist.length || 1) + '</div>' +
        '<div class="graph-labels">' +
          '<span>' + (hist.length ? fmtTime(hist[0].t) : "-") + '</span>' +
          '<span>' + (mid ? fmtTime(mid.t) : "") + '</span>' +
          '<span>' + (hist.length ? fmtTime(hist[hist.length - 1].t) : "-") + '</span>' +
        '</div></div>' +
      '<div class="incidents"><h3>障害履歴</h3>' + iHtml + '</div>' +
      (site.type === "web" && site.url ? '<div style="margin-top:20px;text-align:right;"><a href="' + site.url + '" target="_blank" rel="noopener noreferrer" class="visit-btn">サイトへ行く →</a></div>' : '');

    document.getElementById("modal-body").querySelector(".modal-close")
      .addEventListener("click", closeDetail);
    document.getElementById("overlay").classList.add("open");
  }
  function closeDetail() { document.getElementById("overlay").classList.remove("open"); }
  document.getElementById("overlay").addEventListener("click", function(e){ if (e.target.id === "overlay") closeDetail(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeDetail(); });

  function applyData(data) {
    var content     = document.getElementById("content");
    var summaryLine = document.getElementById("summary-line");
    var lastUpdated = document.getElementById("last-updated");
    var sites = data.sites || [];

    if (!sites.length) {
      content.innerHTML = '<div class="empty-state"><h2>まだデータがありません</h2><p>SCAN NOWを押すか、Cron Triggerの初回実行を待ってください。</p></div>';
      summaryLine.textContent = "監視対象なし";
      return;
    }

    var down = sites.filter(function(s){
      var l = s.history[s.history.length - 1];
      return l && !l.up;
    });

    summaryLine.innerHTML = !down.length
      ? "<b>" + sites.length + "</b> / <b>" + sites.length + "</b> 件が稼働中"
      : "<b>" + down.length + "</b>件停止中(全" + sites.length + "件中)";

    lastUpdated.innerHTML = '<span id="global-dot"></span>最終チェック: ' + fmtTime(data.updated);
    var dot = document.getElementById("global-dot");
    dot.style.background  = !down.length ? "var(--ok)"   : "var(--down)";
    dot.style.boxShadow   = !down.length ? "0 0 10px 2px var(--ok-glow)" : "0 0 10px 2px var(--down-glow)";

    content.innerHTML = "";
    var grid = document.createElement("div");
    grid.className = "grid";
    sites.slice().sort(function(a, b){
      var au = a.history[a.history.length - 1] ? a.history[a.history.length - 1].up : true;
      var bu = b.history[b.history.length - 1] ? b.history[b.history.length - 1].up : true;
      return au === bu ? 0 : (au ? 1 : -1);
    }).forEach(function(s){ grid.appendChild(renderCard(s)); });
    content.appendChild(grid);
  }

  function loadStatus() {
    fetch(STATUS_URL + "?t=" + Date.now())
      .then(function(r){ if (!r.ok) throw new Error(); return r.json(); })
      .then(applyData)
      .catch(function(){
        document.getElementById("content").innerHTML =
          '<div class="error-state"><h2>データを読み込めませんでした</h2>' +
          '<p>data/status.json がまだ存在しないか、GitHub Pagesの反映待ちの可能性があります。<br>SCAN NOWを押してから1〜2分待ってリロードしてください。</p></div>';
        document.getElementById("summary-line").textContent = "読み込みエラー";
      });
  }

  document.getElementById("scan-btn").addEventListener("click", function(){
    var btn = document.getElementById("scan-btn");
    btn.disabled = true;
    btn.textContent = "SCANNING...";
    fetch(WORKER_URL + "/api/check")
      .then(function(r){ return r.json(); })
      .then(function(){
        // Workerがstatus.jsonをcommitした後にGitHub Pagesへ反映されるまで
        // 少し待ってからstatus.jsonを再取得する
        setTimeout(loadStatus, 8000);
      })
      .catch(function(){ alert("Workerとの通信に失敗しました。WORKER_URLを確認してください。"); })
      .finally(function(){ btn.disabled = false; btn.textContent = "SCAN NOW"; });
  });

  loadStatus();
  setInterval(loadStatus, REFRESH_MS);
</script>
</body>
</html>
